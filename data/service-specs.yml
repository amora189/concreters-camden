# Stage 34 — service specification matrix.
#
# Authority: DECISION-04-scope-reduction.md §D23.
#
# EVERY FIELD IS EMPTY AND verified: false. THIS FILE MUST NOT BE POPULATED BY
# AN AGENT.
#
# D23.2 is explicit: not from the existing pages, not from the other nine
# services, not from Australian Standards general knowledge. The owner or a
# qualified engineer supplies every value.
#
# WHY THIS FILE EXISTS
# The ten service pages currently carry an IDENTICAL nine-value specification
# set: 32 MPa, 125mm, SL72, 800mm, 900mm, 1200mm, 4.0-5.5m, 4%, 1:6. A patio
# slab and a commercial hardstand do not share thickness and mesh. The uniform
# set is a property of the copy generator, not of concreting practice, so every
# one of those values is currently an UNATTRIBUTED SPECIFICATION PUBLISHED AS
# FACT on ten published pages. See reports/34-service-rebuild-brief.md §2.
#
# HOW TO FILL A FIELD
#   value:        the figure, with its unit, exactly as it should appear
#   verified:     set true only when attested
#   attested_by:  owner | engineer | Australian Standard with clause number
#   source:       document, standard clause, or "owner attestation"
#   sighted_date: YYYY-MM-DD
#
# A value without verified: true is treated as absent and MUST NOT be published.

