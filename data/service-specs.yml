# Stage 54 — independent-provider specification model.
# Authority: DECISION-09-independent-provider-specification.md (21 August 2026).
#
# This is a claim-disposition matrix, not a catalogue of Structure Co methods.
# Every public technical field is conditional and numeric output is prohibited
# unless a future evidenced-fixed-value cell supplies exact authority.

schema_version: "2.0"
generated: "2026-08-21"
authority: "DECISION-09-independent-provider-specification.md"
operating_model: "independent-provider-coordination"
populated: true
resolution_model: "claim-removed-or-evidenced-fixed-value"
evidence_register: "reports/53-service-specification-matrix.csv"
owner_decision_ledger: "build/54-independent-provider-decision.json"
numeric_output_prohibited_without_evidence: true

required_fields:
  - concrete thickness
  - concrete strength/grade
  - reinforcement/mesh
  - base preparation
  - joint type and spacing
  - curing requirements
  - drainage/fall
  - edges/formwork
  - service-specific requirements

approved_public_wording:
  design-specific: "The appointed provider and project designer must confirm the applicable requirement for the actual design before work begins."
  council-specific: "The controlling council's current requirements and approved documents must be checked for the actual property before work begins."
  product-specific: "The selected product or finish supplier and appointed provider must confirm the applicable requirement before it is specified."
  site-specific: "The appointed provider must assess and confirm the applicable requirement for the actual site before quoting."
  provider-confirmed: "The appointed provider must confirm the applicable requirement for the selected system and project conditions before work begins."
  not-applicable: "This field is not applicable to the service scope; no technical value is emitted."

disposition_rules:
  claim-removed:
    verified: false
    public_numeric_output: false
    requires: [classification, evidence_or_operating_model_authority, approved_conditional_wording, derivative_claim_scan]
  evidenced-fixed-value:
    verified: true
    public_numeric_output: true
    requires: [source, sighted_date, exact_value]

