  # ---------------------------------------------------------------------------
  # DEPLOYMENT SOURCE OF TRUTH for the public telephone. DECISION-10 D42-R1.
  #
  # These two fields are the ONLY place a published telephone number may come from.
  # lib/seo_spec.py resolves them; scripts/56-build-static-export.py refuses to write
  # deployable output while nsw_number_pending is true. No template, partial or build
  # script may hardcode a number.
  #
  # D42-R1 reverses D42. Ownership of the (03) number was never in question. The defect
  # is a Victorian area code standing as the contact point on a site whose entire
  # ranking case is proximity to Camden, NSW. Omitting `telephone` from schema hid the
  # contradiction from parsers but left it in the header, footer and every call CTA,
  # where both the user and the crawler still saw it.
  #
  # No number may be inferred, researched or carried from another source
  # (CLAUDE.md section 3 hard stop 6). It arrives by owner attestation or not at all.
  # ---------------------------------------------------------------------------
  phone_display:
    value: ""
    verified: false
    required_for: ["site header", "site footer", "call CTAs", "Organization.telephone"]
    blocks_pages: 79
    note: >
