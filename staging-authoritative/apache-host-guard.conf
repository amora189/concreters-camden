# Stage 29 — unexpected-host blocking for authoritative staging.
#
# Loopback binding already prevents off-host access. This is the second layer:
# even from loopback, only the expected Host header is served. It stops a
# misconfigured proxy, a tunnel, or a hosts-file entry from making staging
# answer to the production hostname.

<VirtualHost *:80>
    ServerName 127.0.0.1
    ServerAlias localhost

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Reject any Host we did not expect, including the production hostname.
    <If "%{HTTP_HOST} !~ /^(127\.0\.0\.1|localhost)(:\d+)?$/">
        Require all denied
        ErrorDocument 403 "Blocked: unexpected Host header on authoritative staging."
    </If>

    # Belt and braces with the mu-plugin: noindex at the server layer too.
    Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet"

    # Staging must never be framed or hotlinked.
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
</VirtualHost>
